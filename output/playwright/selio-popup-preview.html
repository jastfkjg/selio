<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selio · 弹窗精简预览</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink:#26352e; --muted:#6c756e; --line:#e5e9e2; --green:#2e6349; --soft:#f2f4ef; --green-soft:#e9f1e8; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1ec; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; -webkit-font-smoothing:antialiased; }
    button,textarea { font:inherit; color:inherit; }
    button { border:0; background:transparent; cursor:pointer; }
    button:focus-visible,textarea:focus-visible { outline:2px solid var(--green); outline-offset:3px; }
    svg { display:block; flex-shrink:0; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .board { width:1000px; padding:40px 58px 44px; }
    .board-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; }
    .board-title { font-size:21px; font-weight:550; letter-spacing:-.5px; }
    .board-version { font-size:12px; color:var(--muted); }
    .states { display:grid; grid-template-columns:420px 420px; gap:44px; }
    .state-label { font-size:12px; color:var(--muted); margin-bottom:13px; display:flex; align-items:center; gap:9px; }
    .state-label span { color:var(--green); font-size:10px; font-weight:650; }
    .window { position:relative; width:420px; height:700px; background:#fff; border:1px solid #dfe5dc; border-radius:16px; box-shadow:0 14px 40px #1e312510,0 2px 6px #1e312506; display:flex; flex-direction:column; }
    .header { height:59px; padding:13px 15px 10px; display:flex; align-items:center; flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:7px; color:var(--green); }
    .mark { width:25px; height:25px; stroke:none; }
    .wordmark { font-size:23px; font-weight:650; line-height:1; letter-spacing:-1.2px; color:var(--ink); }
    .wordmark span { color:var(--green); }
    .header-tools { margin-left:auto; display:flex; align-items:center; gap:1px; color:var(--muted); }
    .icon-button { display:grid; place-items:center; width:31px; height:32px; border-radius:7px; }
    .icon-button:hover { color:var(--ink); background:var(--soft); }
    .drag svg { width:16px; }
    .toolbar { position:relative; display:flex; align-items:center; height:44px; flex-shrink:0; margin:0 15px; padding:3px; background:var(--soft); border-radius:10px; gap:1px; }
    .tab { min-width:0; height:38px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:7px; font-size:12.5px; color:var(--muted); flex:1; white-space:nowrap; }
    .tab svg { width:16px; height:16px; }
    .tab.summary { flex:1.15; }
    .tab.ask { flex:.88; }
    .tab.active { color:var(--green); font-weight:600; background:white; box-shadow:0 1px 4px #26352e0b; }
    .tab:hover:not(.active) { color:var(--ink); }
    .overflow { height:38px; width:37px; flex-shrink:0; display:grid; place-items:center; color:var(--muted); border-radius:7px; margin-left:3px; }
    .overflow:hover,.overflow[aria-expanded="true"] { background:#e3eae1; color:var(--green); }
    .overflow svg { stroke-width:0; fill:currentColor; }
    .context { display:flex; align-items:center; justify-content:space-between; margin:10px 16px 0; padding:9px 2px 12px; color:var(--muted); font-size:11px; border-bottom:1px solid var(--line); text-align:left; }
    .context .count { color:#7a837c; }
    .context svg { width:14px; height:14px; }
    .workspace { flex:1; min-height:0; position:relative; }
    .empty { position:absolute; left:0; right:0; top:134px; text-align:center; }
    .empty h1 { font-size:20px; font-weight:500; letter-spacing:-.45px; line-height:1.35; margin:0; }
    .composer { margin:0 14px 15px; height:95px; padding:11px 11px 9px; border:1px solid #dfe5dc; border-radius:11px; flex-shrink:0; }
    .composer:focus-within { border-color:var(--green); box-shadow:0 0 0 2px var(--green-soft); }
    .composer textarea { display:block; width:100%; border:0; background:transparent; padding:0; outline:0; resize:none; font-size:12px; line-height:1.6; height:39px; }
    .composer textarea::placeholder { color:var(--muted); opacity:1; }
    .composer-footer { display:flex; align-items:center; justify-content:space-between; margin-top:3px; }
    .model { display:flex; align-items:center; gap:10px; min-height:28px; padding:3px 5px; font-size:11px; }
    .model svg { width:13px; height:13px; }
    .send { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; background:#a5b9ac; color:#fff; cursor:default; }
    .send svg { width:19px; height:19px; stroke-width:1.9; }
    .resize { position:absolute; width:7px; height:7px; border-right:1.5px solid #a8b0a7; border-bottom:1.5px solid #a8b0a7; border-radius:0 0 2px 0; right:5px; bottom:5px; }
    .action-menu { position:absolute; right:0; top:52px; width:178px; padding:5px; border:1px solid var(--line); border-radius:10px; background:#fff; box-shadow:0 6px 22px #26352e12,0 1px 3px #26352e06; z-index:3; }
    .action-menu[hidden] { display:none; }
    .menu-item { display:flex; align-items:center; gap:10px; width:100%; min-height:42px; padding:10px 11px; font-size:12px; text-align:left; border-radius:6px; }
    .menu-item svg { color:var(--green); width:17px; height:17px; }
    .menu-item:hover,.menu-item:focus-visible { background:var(--green-soft); }
    .detail-caption { margin-top:15px; color:var(--muted); font-size:11px; }
    @media (prefers-reduced-motion:no-preference) { .action-menu { animation:menu-enter 120ms ease-out; } @keyframes menu-enter { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:translateY(0); } } }
  </style>
</head>
<body>
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <defs>
      <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="currentColor"/><path d="M22 9.5H14.5C11.5 9.5 10 11 10 13s1.5 3 4.5 3h3c3 0 4.5 1 4.5 3s-1.5 3.5-4.5 3.5H10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M22 7v5M10 20v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="grip" viewBox="0 0 24 24"><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="8" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></symbol>
      <symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18m-5-12-3 3 3 3"/></symbol>
      <symbol id="settings" viewBox="0 0 24 24"><path d="M9 6h12M3 18h12"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/></symbol>
      <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="translate" viewBox="0 0 24 24"><path d="m5 8 6 6m-7 0 6-6 2-5M2 5h12M7 2v3m7 17 5-11 5 11m-8-4h6" transform="translate(-1 0)"/></symbol>
      <symbol id="summary" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
      <symbol id="chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
      <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></symbol>
      <symbol id="sparkles" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3zM20 2v4m-2-2h4M4 17v4m-2-2h4"/></symbol>
    </defs>
  </svg>
  <main class="board">
    <div class="board-header"><div class="board-title">弹窗 · 精简方案</div><div class="board-version">Selio / Preview 01</div></div>
    <div class="states">
      <section class="state" id="default-state"><div class="state-label"><span>01</span> 默认状态</div><div class="window"></div><div class="detail-caption">保留操作、上下文和输入框，让对话成为主角。</div></section>
      <section class="state" id="menu-state"><div class="state-label"><span>02</span> 更多操作展开</div><div class="window"></div><div class="detail-caption">「···」收纳更多操作，菜单只显示可执行的选项。</div></section>
    </div>
  </main>
  <template id="window-content">
    <header class="header">
      <div class="brand"><svg class="mark"><use href="#mark"/></svg><span class="wordmark">selio<span>.</span></span></div>
      <div class="header-tools"><button class="icon-button drag" aria-label="Move window"><svg><use href="#grip"/></svg></button><button class="icon-button" aria-label="Pin to sidebar"><svg><use href="#panel"/></svg></button><button class="icon-button" aria-label="Settings"><svg><use href="#settings"/></svg></button><button class="icon-button" aria-label="Close window"><svg><use href="#close"/></svg></button></div>
    </header>
    <nav class="toolbar" aria-label="Reading actions">
      <button class="tab"><svg><use href="#translate"/></svg>Translate</button>
      <button class="tab summary"><svg><use href="#summary"/></svg>Summarize</button>
      <button class="tab ask active" aria-pressed="true"><svg><use href="#chat"/></svg>Ask AI</button>
      <button class="overflow" aria-label="More actions" title="More actions" aria-haspopup="menu" aria-expanded="false"><svg><use href="#dots"/></svg></button>
      <div class="action-menu" role="menu" hidden><button class="menu-item" role="menuitem"><svg><use href="#sparkles"/></svg>Explain</button></div>
    </nav>
    <button class="context" aria-expanded="false"><span>Context <span class="count">· 250 characters</span></span><svg><use href="#chevron"/></svg></button>
    <div class="workspace"><div class="empty"><h1>What would you like to know?</h1></div></div>
    <form class="composer"><textarea aria-label="Ask about the selected text" placeholder="Ask a question…"></textarea><div class="composer-footer"><button class="model" type="button">Qwen<svg><use href="#chevron"/></svg></button><button class="send" type="submit" aria-label="Send question" disabled><svg><use href="#arrow"/></svg></button></div></form>
    <span class="resize" aria-hidden="true"></span>
  </template>
  <script>
    document.querySelectorAll('.window').forEach(w => {
      w.append(document.querySelector('#window-content').content.cloneNode(true));
      const trigger=w.querySelector('.overflow'),menu=w.querySelector('.action-menu');
      const setOpen=open=>{ trigger.setAttribute('aria-expanded',String(open)); menu.hidden=!open; };
      trigger.addEventListener('click',()=>setOpen(menu.hidden));
      trigger.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();setOpen(true);menu.querySelector('button').focus();}});
      w.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setOpen(false);trigger.focus();}});
      menu.querySelector('button').addEventListener('click',()=>{setOpen(false);trigger.focus();});
      document.addEventListener('pointerdown',e=>{if(!trigger.contains(e.target)&&!menu.contains(e.target))setOpen(false);});
      w.querySelector('form').addEventListener('submit',e=>e.preventDefault());
    });
    document.querySelector('#menu-state .overflow').click();
  </script>
</body>
</html>
